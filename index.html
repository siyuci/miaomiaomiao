                    { text: "评论一句：怎么了？", link: 3, mods: { EI: 3, TF: -3 } }
                ]
            },
            {
                text: "你朋友在群里发了一个红包，你抢到最少。你——",
                options: [

                    { text: "不说话，默默收了。", link: 6, mods: { EI: -3, TF: -3 } },
                    { text: "跟着发一个红包出去。", link: 1, mods: { EI: 3, TF: -3 } },
                    { text: "截图发朋友圈，说今天运气好。", link: 0, mods: { EI: 3, TF: 3, JP: -3 } }
                ]
            },
            {
                text: "你到公司发现昨天忘了关空调，开了一整夜。你——",
                options: [
                    { text: "关了就行。没人发现就算了。", link: 5, mods: { JP: -3, TF: -3 } },
                    { text: "跟同事说一声。下次注意。", link: 3, mods: { TF: 3, JP: 3, EI: -3 } },
                    { text: "不说了。反正也没人知道。", link: 0, mods: { EI: -3, JP: -3 } },
                    { text: "看看有没有人被影响到。有的话道个歉。", link: 4, mods: { TF: 3, EI: -3, JP: 3 } }
                ]
            },
            {
                text: "你同事升职了，请全组喝奶茶。你心里有点酸。你——",
                options: [
                    { text: "点一杯。说恭喜。", link: 4, mods: { TF: -3, EI: -3, JP: -3 } },
                    { text: "点一杯。然后问问升职有什么经验。", link: 3, mods: { TF: 3, JP: 3, EI: -3 } },
                    { text: "不点。说自己不喝奶茶。", link: 1, mods: { TF: 3, EI: -3 } },
                    { text: "点一杯。回头想想自己差在哪。", link: 5, mods: { TF: 3, JP: 3, EI: -3 } }
                ]
            },
            {
                text: "你打车，司机一直在绕路。你——",
                options: [
                    { text: "直接说：师傅，你绕路了吧。", link: 1, mods: { TF: 3, EI: 3 } },
                    { text: "不说了。到了给个差评。", link: 3, mods: { EI: -3, TF: 3, JP: 3 } },
                    { text: "可能人家有苦衷。算了。", link: 6, mods: { TF: -3, JP: -3 } },
                    { text: "看导航。如果确实绕了就开口。", link: 2, mods: { TF: 3, SN: -3, JP: 3 } }
                ]
            }
        ];

        const INIT_VAL = 50;

        let currentQ = 0;
        let answers = new Array(QUESTIONS.length).fill(null);
        let dims = new Array(4).fill(INIT_VAL);
        let autoTimer = null;

        const coverSection = document.getElementById('coverSection');
        const quizSection = document.getElementById('quizSection');
        const resultSection = document.getElementById('resultSection');
        const resultPagesContainer = document.getElementById('resultPagesContainer');
        const startBtn = document.getElementById('startBtn');
        const qNumLabel = document.getElementById('qNumLabel');
        const progressFill = document.getElementById('progressFill');
        const questionText = document.getElementById('questionText');
        const optionsList = document.getElementById('optionsList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        function dimIndex(name) {
            return DIM_NAMES.indexOf(name);
        }

        function applyMods(mods, sign) {
            for (const key in mods) {
                const i = dimIndex(key);
                if (i >= 0) {
                    dims[i] += sign * mods[key];
                    if (dims[i] < 0) dims[i] = 0;
                    if (dims[i] > 100) dims[i] = 100;
                }
            }
        }

        function clearAutoTimer() {
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        function renderQuestion() {
            const q = QUESTIONS[currentQ];
            qNumLabel.textContent = `第 ${currentQ + 1} / ${QUESTIONS.length} 题`;
            progressFill.style.width = `${(currentQ / QUESTIONS.length) * 100}%`;
            questionText.textContent = q.text;

            optionsList.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (answers[currentQ] && answers[currentQ].charIdx === idx) btn.classList.add('selected');
                const prefix = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="option-prefix">${prefix}</span><span>${opt.text}</span>`;
                btn.addEventListener('click', () => {
                    clearAutoTimer();
                    if (answers[currentQ]) {
                        applyMods(answers[currentQ].mods, -1);
                    }
                    answers[currentQ] = { charIdx: idx, mods: opt.mods, link: opt.link };
                    applyMods(opt.mods, 1);
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    if (currentQ < QUESTIONS.length - 1) {
                        autoTimer = setTimeout(() => {
                            if (answers[currentQ]) {
                                goToQuestion(currentQ + 1);
                            }
                        }, 250);
                    }
                });
                optionsList.appendChild(btn);
            });

            prevBtn.disabled = currentQ === 0;
            nextBtn.textContent = currentQ === QUESTIONS.length - 1 ? '查看结果' : '下一题 →';
        }

        function allAnswered() { return answers.every(a => a !== null); }

        function getLibraryLinkCounts() {
            const counts = new Array(CHARACTERS.length).fill(0);
            QUESTIONS.forEach(q => {
                q.options.forEach(opt => {
                    if (opt.link !== undefined) counts[opt.link]++;
                });
            });
            return counts;
        }

        function getScores() {
            const attrResults = CHARACTERS.map((c) => {
                let weightedDiff = 0;
                let maxWeightedDiff = 0;
                for (let d = 0; d < 4; d++) {
                    const weight = 1 + Math.abs(c.vec[d] - 50) / 50;
                    weightedDiff += Math.abs(dims[d] - c.vec[d]) * weight;
                    maxWeightedDiff += 100 * weight;
                }
                const mismatchPercent = (weightedDiff / maxWeightedDiff) * 100;
                return Math.max(0, Math.round(100 - mismatchPercent));
            });

            const libCounts = getLibraryLinkCounts();
            const userCounts = new Array(CHARACTERS.length).fill(0);
            answers.forEach(a => {
                if (a && a.link !== undefined) userCounts[a.link]++;
            });
            const linkScores = CHARACTERS.map((c, i) => {
                if (libCounts[i] === 0) return 0;
                return Math.round((userCounts[i] / libCounts[i]) * 100);
            });

            const results = CHARACTERS.map((c, i) => {
                const finalPercent = Math.round(attrResults[i] * 0.7 + linkScores[i] * 0.3);
                return { idx: i, percent: Math.max(0, finalPercent) };
            });
            results.sort((a, b) => b.percent - a.percent);
            return results;
        }

        function renderDimAxisHTML(charVec) {
            let html = '';
            DIM_PAIRS.forEach(pair => {
                const userPercent = dims[dimIndex(pair.leftKey)];
                const charPercent = charVec[dimIndex(pair.leftKey)];

                html += `
                    <div class="dim-row">
                        <div class="dim-labels">
                            <span class="left-label">${pair.leftLabel}</span>
                            <span class="right-label">${pair.rightLabel}</span>
                        </div>
                        <div class="dim-track-wrap">
                            <div class="dim-track-line"></div>
                            <div class="dim-center-tick"></div>
                            <div class="dim-dot dim-dot-user" style="left:${userPercent}%"></div>
                            <div class="dim-dot dim-dot-char" style="left:${charPercent}%"></div>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function buildResultPage(character, percent, isFirst) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'result-page';
            let html = '';
            if (!isFirst) {
                html += `<div class="result-page-label">并列匹配人物</div>`;
            }
            html += `
                <div class="result-title">✨ 你匹配的人物 ✨</div>
                <div class="result-name">${character.name}</div>
                <div class="result-score">匹配度 ${percent}%</div>
                <div class="result-block">
                    <div class="result-block-title">生平</div>
                    <div class="result-block-text">${character.bio}</div>
                </div>
                <div class="result-block">
                    <div class="result-block-title">性格剖析</div>
                    <div class="result-block-text">${character.personality}</div>
                </div>
                <div class="result-block">
                    <div class="result-block-title">性格维度</div>
                    <div class="dim-axis">${renderDimAxisHTML(character.vec)}</div>
                    <div class="dim-legend">
                        <span><span class="legend-dot legend-user"></span>你</span>
                        <span><span class="legend-dot legend-char"></span>匹配人物</span>
                    </div>
                </div>
            `;
            pageDiv.innerHTML = html;
            return pageDiv;
        }

        function showResult() {
            const scores = getScores();
            const topPercent = scores[0].percent;
            const topMatches = scores.filter(s => s.percent === topPercent);

            resultPagesContainer.innerHTML = '';

            topMatches.forEach((match, i) => {
                const character = CHARACTERS[match.idx];
                const page = buildResultPage(character, match.percent, i === 0);
                resultPagesContainer.appendChild(page);
            });

            const topIdxSet = new Set(topMatches.map(m => m.idx));
            const rest = scores.filter(s => !topIdxSet.has(s.idx));

            if (rest.length > 0) {
                const similarBlock = document.createElement('div');
                similarBlock.className = 'result-block';
                similarBlock.style.marginTop = '16px';

                let listHtml = '<div class="result-block-title">其他相似的人</div><div class="similar-list">';
                const firstPercent = rest[0].percent;
                const firstLevel = rest.filter(s => s.percent === firstPercent);
                const displayList = [...firstLevel];

                if (displayList.length < rest.length) {
                    const secondPercent = rest.find(s => s.percent !== firstPercent)?.percent;
                    if (secondPercent !== undefined) {
                        const secondLevel = rest.filter(s => s.percent === secondPercent);
                        displayList.push(...secondLevel.slice(0, 2));
                    }
                }

                displayList.forEach(item => {
                    listHtml += `
                        <div class="similar-item">
                            <span style="min-width:80px;">${CHARACTERS[item.idx].name}</span>
                            <div class="similar-bar-wrap"><div class="similar-bar" style="width:${item.percent}%"></div></div>
                            <span class="similar-percent">${item.percent}%</span>
                        </div>
                    `;
                });
                listHtml += '</div>';
                similarBlock.innerHTML = listHtml;
                resultPagesContainer.appendChild(similarBlock);
            }

            quizSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            progressFill.style.width = '100%';
        }

        function goToQuestion(index) {
            if (index < 0 || index >= QUESTIONS.length) return;
            clearAutoTimer();
            currentQ = index;
            renderQuestion();
        }

        function handleNext() {
            clearAutoTimer();
            if (!answers[currentQ]) { alert('请先选择一个选项。'); return; }
            if (currentQ === QUESTIONS.length - 1) {
                if (!allAnswered()) { alert('请完成所有题目后再查看结果。'); return; }
                showResult();
            } else { goToQuestion(currentQ + 1); }
        }

        function handlePrev() {
            clearAutoTimer();
            if (currentQ > 0) goToQuestion(currentQ - 1);
        }

        function startQuiz() {
            coverSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            currentQ = 0;
            answers = new Array(QUESTIONS.length).fill(null);
            dims = new Array(4).fill(INIT_VAL);
            clearAutoTimer();
            progressFill.style.width = '0%';
            renderQuestion();
        }

        function restartGame() {
            clearAutoTimer();
            coverSection.classList.remove('hidden');
            quizSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            currentQ = 0;
            answers = new Array(QUESTIONS.length).fill(null);
            dims = new Array(4).fill(INIT_VAL);
            progressFill.style.width = '0%';
        }

        function init() {
            startBtn.addEventListener('click', startQuiz);
            prevBtn.addEventListener('click', handlePrev);
            nextBtn.addEventListener('click', handleNext);
            restartBtn.addEventListener('click', restartGame);
        }
        init();
    </script>
