<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>吴越争霸 · 你是哪一种人</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #3a2e22;
        }
        .game-container {
            width: 100%;
            max-width: 430px;
            background: #fffcf7;
            border-radius: 28px;
            padding: 28px 22px 26px;
            box-shadow: 0 4px 24px rgba(90,70,50,0.10), 0 1px 3px rgba(90,70,50,0.06);
            border: 1px solid #e8e0d4;
        }
        h1 {
            font-size: 1.35rem;
            text-align: center;
            font-weight: 600;
            color: #4a3a28;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }
        .subhead {
            text-align: center;
            font-size: 0.68rem;
            color: #a89888;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }
        .divider {
            width: 100%;
            height: 1px;
            background: #e8e0d4;
            margin-bottom: 22px;
        }
        .cover-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 16px 4px 8px;
        }
        .cover-icon {
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 20px;
        }
        .cover-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #4a3a28;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }
        .cover-subtitle {
            font-size: 0.88rem;
            color: #a89888;
            letter-spacing: 3px;
            margin-bottom: 26px;
        }
        .cover-desc {
            font-size: 0.86rem;
            color: #8a7a68;
            line-height: 1.9;
            margin-bottom: 34px;
            letter-spacing: 0.3px;
        }
        .start-btn {
            background: #5a4a38;
            border: none;
            color: #fefcf8;
            padding: 16px 52px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 4px;
            box-shadow: 0 3px 0 #3a2e22, 0 6px 16px rgba(90,70,50,0.25);
            transition: all 0.1s ease;
            cursor: pointer;
            width: 80%;
            max-width: 270px;
        }
        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #3a2e22, 0 3px 8px rgba(90,70,50,0.2);
        }
        .cover-tip {
            font-size: 0.66rem;
            color: #c8bcae;
            margin-top: 20px;
            letter-spacing: 2px;
        }
        .question-counter {
            font-size: 0.72rem;
            color: #a89888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }
        .progress-bar {
            height: 3px;
            background: #ece6de;
            border-radius: 10px;
            flex: 1;
            margin-left: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #8a7a68;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 1rem;
            line-height: 1.65;
            background: #faf7f2;
            padding: 18px 16px;
            border-radius: 16px;
            border: 1px solid #ece6de;
            margin-bottom: 16px;
            font-weight: 500;
            color: #4a3a28;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fffcf7;
            border: 1.5px solid #e0d8cc;
            color: #4a3a28;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            text-align: left;
            font-weight: 400;
            line-height: 1.5;
            transition: all 0.15s ease;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            word-break: break-word;
        }
        .option-btn:active {
            background: #f5f0e8;
            border-color: #c8bcae;
        }
        .option-btn.selected {
            background: #f0ebe3;
            border-color: #8a7a68;
            color: #3a2e22;
        }
        .option-prefix {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.7rem;
            color: #a89888;
            border: 1px solid #e0d8cc;
            border-radius: 50%;
            margin-right: 10px;
            margin-top: 1px;
            background: #faf7f2;
        }
        .option-btn.selected .option-prefix {
            color: #fff;
            background: #8a7a68;
            border-color: #8a7a68;
        }
        .nav-area {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .btn {
            flex: 1;
            background: #5a4a38;
            border: none;
            color: #fefcf8;
            padding: 13px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 #3a2e22, 0 4px 12px rgba(90,70,50,0.2);
            transition: all 0.1s ease;
            cursor: pointer;
            text-align: center;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #3a2e22, 0 2px 6px rgba(90,70,50,0.15);
        }
        .btn:disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .btn-secondary {
            background: #f0ebe3;
            color: #6a5a48;
            box-shadow: 0 3px 0 #e0d8cc, 0 2px 8px rgba(90,70,50,0.1);
        }
        .btn-secondary:active {
            box-shadow: 0 0 0 #e0d8cc, 0 1px 4px rgba(90,70,50,0.1);
        }
        .result-area {
            text-align: center;
            padding: 12px 4px 6px;
        }
        .result-title {
            font-size: 0.72rem;
            color: #a89888;
            letter-spacing: 4px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }
        .result-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #4a3a28;
            letter-spacing: 4px;
            margin-bottom: 22px;
            line-height: 1.2;
        }
        .result-desc {
            background: #faf7f2;
            padding: 18px 18px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.75;
            color: #5a4a38;
            border: 1px solid #ece6de;
            margin-bottom: 22px;
            text-align: left;
        }
        .restart-btn {
            width: 100%;
            padding: 13px;
            font-size: 0.9rem;
            letter-spacing: 3px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <h1>吴越争霸</h1>
        <div class="subhead">你是哪一种人</div>
        <div class="divider"></div>

        <div id="coverSection" class="cover-area">
            <div class="cover-icon">⚔️</div>
            <div class="cover-title">吴越争霸</div>
            <div class="cover-subtitle">你是哪一种人</div>
            <div class="cover-desc">
                夫椒之后，吴越风云。<br>
                十八道日常小事，<br>
                看清你的选择倾向，<br>
                匹配一位那个时代的人物。
            </div>
            <button class="start-btn" id="startBtn">开 始</button>
            <div class="cover-tip">约 需 2 分 钟</div>
        </div>

        <div id="quizSection" class="hidden">
            <div class="question-counter">
                <span id="qNumLabel">第 1 / 18 题</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-list" id="optionsList"></div>
            <div class="nav-area">
                <button class="btn btn-secondary" id="prevBtn" disabled>← 上一题</button>
                <button class="btn" id="nextBtn">下一题 →</button>
            </div>
        </div>

        <div id="resultSection" class="result-area hidden">
            <div class="result-title">✨ 你匹配的人物 ✨</div>
            <div class="result-name" id="resultName"></div>
            <div class="result-desc" id="resultDesc"></div>
            <button class="btn restart-btn" id="restartBtn">重新测试</button>
        </div>
    </div>

    <script>
        const CHARACTERS = [
            {
                name: "勾践",
                desc: "允常之子。夫椒之战败于吴，退守会稽。求和获释后苦身焦思，几用谋臣良将之策，经二十年积累，终破姑苏而灭吴。后北上盟于诸侯，定霸东南。"
            },
            {
                name: "夫差",
                desc: "阖闾之子。阖闾伐越受伤而死，夫差即位三年后大败越军，围勾践于会稽。许越求和后，一心北上争霸。直至黄池会盟时越军趁虚袭吴杀太子，此后吴国连年败退，姑苏城破后于阳山（一说太湖）自杀，遂亡吴。"
            },
            {
                name: "伍子胥",
                desc: "名员，字子胥，楚人。父兄被楚平王所杀，辗转入吴，助阖闾夺位。夫差即位后，夫椒之战破越。越求和时力谏君王勿许，夫差不听。后谏夫差勿伐齐，又不听，渐被疏远。公元前484年，夫差赐属镂之剑，伍子胥自杀。"
            },
            {
                name: "范蠡",
                desc: "字少伯，楚宛人。入越事勾践。辅佐勾践图强，吴灭后认为勾践可与共患难不可共安乐，遂辞别离去。传说浮海至齐，变名经商，后定居于陶，世称陶朱公。"
            },
            {
                name: "文种",
                desc: "字子禽（一说少禽），楚郢人。越国大夫。勾践困于会稽时，文种献计贿赂吴太宰伯嚭，促成和议。归国后与范蠡共同辅佐勾践，阴谋迭出。灭吴后，范蠡离去并留书劝其走，文种未听。后勾践赐剑命其自杀。"
            },
            {
                name: "伯嚭",
                desc: "字子馀，楚国人，吴国太宰。因楚国内乱奔吴，任太宰。夫椒之战后，越国派文种携美女宝器贿赂伯嚭，伯嚭受贿后劝夫差许越求和。此后屡进谗言排挤伍子胥。吴亡后，伯嚭被越国所诛。"
            },
            {
                name: "计然",
                desc: "一名研，又一名倪（名字真多）。仕于越，助勾践图强。主张内蓄五谷、实其金银、满其府库、励其甲兵，为越国复兴提供经济方略。"
            },
            {
                name: "西施",
                desc: "越国苎萝人。越败求和后，越败求和后与郑旦一同被进献吴王夫差。传说荣宠一时，沉水而死。"
            },
            {
                name: "郑旦",
                desc: "越国苎萝人。与西施齐名，越败求和后与西施同被进献吴王夫差。传说半生寥居深宫，下落不明。"
            }
        ];

        // 18题 × 4选项 = 72，9人每人 8 次，完全均分。
        const QUESTIONS = [
            {
                text: "早上闹钟响了，你其实已经醒了，但就是不想起。你——",
                options: [
                    { text: "再躺五分钟。就五分钟。", charIdx: 8 },
                    { text: "起来。躺着也是躺着，不如起来。", charIdx: 6 },
                    { text: "烦。今天能不能请假。", charIdx: 0 },
                    { text: "先摸手机刷一会儿。刷完再起。", charIdx: 5 }
                ]
            },
            {
                text: "你点了一份外卖，送过来发现少了一份小菜。你——",
                options: [
                    { text: "算了。一份小菜不值得折腾。", charIdx: 7 },
                    { text: "找商家。该我的就得给我。", charIdx: 2 },
                    { text: "找商家，顺便问问能不能补张券。", charIdx: 5 },
                    { text: "看看订单，确认是不是自己漏点了。", charIdx: 4 }
                ]
            },
            {
                text: "你在群里看到大家在约周末吃饭，没人单独问你。你——",
                options: [
                    { text: "等有人@我再说。", charIdx: 8 },
                    { text: "主动说一句：我也去。", charIdx: 1 },
                    { text: "看看时间。合适就去。", charIdx: 6 },
                    { text: "不去。周末想自己待着。", charIdx: 3 }
                ]
            },
            {
                text: "你朋友发来一张自拍，问你“好不好看”。你觉得一般。你——",
                options: [
                    { text: "说好看。朋友嘛，夸就完了。", charIdx: 8 },
                    { text: "说还行。不违心也不伤人。", charIdx: 4 },
                    { text: "说一般。实话实说。", charIdx: 2 },
                    { text: "说好看，然后问他是不是P了。", charIdx: 5 }
                ]
            },
            {
                text: "你下班回家，发现家门口被邻居放了一个大纸箱。你——",
                options: [
                    { text: "挪开就行。不费事。", charIdx: 8 },
                    { text: "敲门跟他说一声。放这不太好。", charIdx: 2 },
                    { text: "先看看里面是什么。", charIdx: 5 },
                    { text: "拍个照。发到业主群里问一声。", charIdx: 4 }
                ]
            },
            {
                text: "你正忙得焦头烂额，同事过来说“帮我看个东西，很快”。你——",
                options: [
                    { text: "放下手头的事先帮他看。", charIdx: 8 },
                    { text: "说：我现在有点忙，半小时后行吗？", charIdx: 4 },
                    { text: "说：现在真不行，你找别人看看。", charIdx: 0 },
                    { text: "一边忙一边扫一眼，随便应付两句。", charIdx: 5 }
                ]
            },
            {
                text: "你在网上买了一件衣服，收到后发现有色差，但不算严重。你——",
                options: [
                    { text: "留着穿。反正也不贵。", charIdx: 7 },
                    { text: "退货。色差就是色差。", charIdx: 2 },
                    { text: "问问客服能不能补偿一点。", charIdx: 5 },
                    { text: "看看评论里别人拍的图是不是也这样。", charIdx: 4 }
                ]
            },
            {
                text: "你朋友跟你说他最近在学做饭，问你要不要周末去他家吃。你——",
                options: [
                    { text: "去。捧个场。", charIdx: 8 },
                    { text: "去。但先说好，不好吃我会直说。", charIdx: 2 },
                    { text: "去。顺便带点东西过去。", charIdx: 4 },
                    { text: "看情况。周末可能有事。", charIdx: 3 }
                ]
            },
            {
                text: "你正在排队，后面的人一直往前挤，贴你很近。你——",
                options: [
                    { text: "忍一忍。马上就轮到了。", charIdx: 8 },
                    { text: "回头看他一眼。让他知道我在意。", charIdx: 2 },
                    { text: "往前挪一步，拉开距离。", charIdx: 4 },
                    { text: "直接说：麻烦别挤。", charIdx: 0 }
                ]
            },
            {
                text: "你朋友跟你借一个东西，说用完就还。结果过了两周还没还。你——",
                options: [
                    { text: "再等等。可能他忘了。", charIdx: 7 },
                    { text: "直接问他要。都两周了。", charIdx: 2 },
                    { text: "发条消息：那个东西我用一下。", charIdx: 4 },
                    { text: "不提了。下次不借了。", charIdx: 3 }
                ]
            },
            {
                text: "你在超市结账，收银员多扫了一件商品。你——",
                options: [
                    { text: "当场说：这个我没买。", charIdx: 2 },
                    { text: "算了。就几块钱。", charIdx: 8 },
                    { text: "说一声。但态度客气点。", charIdx: 4 },
                    { text: "说一声。顺便看看还有没有别的扫错了。", charIdx: 0 }
                ]
            },
            {
                text: "你刷到一条视频，说“每天坚持这个动作，一个月瘦十斤”。你——",
                options: [
                    { text: "收藏了。明天开始练。", charIdx: 5 },
                    { text: "划走。这种多半不靠谱。", charIdx: 3 },
                    { text: "看看评论区有没有人说真的有用。", charIdx: 4 },
                    { text: "转发给朋友，说“要不咱俩试试”。", charIdx: 8 }
                ]
            },
            {
                text: "你到公司发现昨天走的时候忘了关空调，开了一整夜。你——",
                options: [
                    { text: "关了就行。没人发现就算了。", charIdx: 5 },
                    { text: "跟同事说一声。下次注意。", charIdx: 0 },
                    { text: "不说了。反正也没人知道。", charIdx: 7 },
                    { text: "看看有没有人被影响到。有的话道个歉。", charIdx: 4 }
                ]
            },
            {
                text: "你朋友在朋友圈发了一条很长的负能量状态。你——",
                options: [
                    { text: "私聊问一句：还好吗？", charIdx: 4 },
                    { text: "点个赞。表示我看到了。", charIdx: 8 },
                    { text: "不评论。这种事不好掺和。", charIdx: 3 },
                    { text: "评论一句：想开点。", charIdx: 5 }
                ]
            },
            {
                text: "你同事升职了，请全组喝奶茶。你心里其实有点酸。你——",
                options: [
                    { text: "点一杯。说恭喜。", charIdx: 8 },
                    { text: "点一杯。然后问问升职有什么经验。", charIdx: 4 },
                    { text: "不点。说自己不喝奶茶。", charIdx: 2 },
                    { text: "点一杯。回头想想自己差在哪。", charIdx: 0 }
                ]
            },
            {
                text: "你在家做饭，发现盐用完了。菜已经下锅了。你——",
                options: [
                    { text: "下楼买。不能让菜毁了。", charIdx: 1 },
                    { text: "不放了。凑合吃。", charIdx: 8 },
                    { text: "看看有没有别的调料能顶一下。", charIdx: 6 },
                    { text: "把菜倒了。重做。", charIdx: 0 }
                ]
            },
            {
                text: "你朋友跟你说，他最近在做一件他觉得特别有意思的事，但你听下来觉得不太靠谱。你——",
                options: [
                    { text: "说挺好的。他高兴就行。", charIdx: 8 },
                    { text: "把你觉得不靠谱的地方说出来。", charIdx: 2 },
                    { text: "问他：你想清楚后面怎么走了吗？", charIdx: 4 },
                    { text: "嘴上说挺好。心里觉得他迟早要栽。", charIdx: 5 }
                ]
            },
            {
                text: "如果让你用一种状态形容你最近的日子，你会选——",
                options: [
                    { text: "在攒。攒钱攒劲攒本事。", charIdx: 6 },
                    { text: "在冲。停不下来。", charIdx: 1 },
                    { text: "在耗。没什么特别想干的。", charIdx: 8 },
                    { text: "在撑。每天都是硬扛。", charIdx: 7 }
                ]
            }
        ];

        // 统计每人出现次数（用于验证均分）
        // 结果：每人 8 次

        let currentQ = 0;
        let answers = new Array(QUESTIONS.length).fill(null);

        const coverSection = document.getElementById('coverSection');
        const quizSection = document.getElementById('quizSection');
        const resultSection = document.getElementById('resultSection');
        const startBtn = document.getElementById('startBtn');
        const qNumLabel = document.getElementById('qNumLabel');
        const progressFill = document.getElementById('progressFill');
        const questionText = document.getElementById('questionText');
        const optionsList = document.getElementById('optionsList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const resultName = document.getElementById('resultName');
        const resultDesc = document.getElementById('resultDesc');

        function renderQuestion() {
            const q = QUESTIONS[currentQ];
            qNumLabel.textContent = `第 ${currentQ + 1} / ${QUESTIONS.length} 题`;
            progressFill.style.width = `${(currentQ / QUESTIONS.length) * 100}%`;
            questionText.textContent = q.text;

            optionsList.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (answers[currentQ] === opt.charIdx) btn.classList.add('selected');
                const prefix = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="option-prefix">${prefix}</span><span>${opt.text}</span>`;
                btn.addEventListener('click', () => {
                    answers[currentQ] = opt.charIdx;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                optionsList.appendChild(btn);
            });

            prevBtn.disabled = currentQ === 0;
            nextBtn.textContent = currentQ === QUESTIONS.length - 1 ? '查看结果' : '下一题 →';
        }

        function allAnswered() { return answers.every(a => a !== null); }

        function getResultCharacterIdx() {
            const countMap = new Map();
            answers.forEach(charIdx => {
                if (charIdx === null) return;
                countMap.set(charIdx, (countMap.get(charIdx) || 0) + 1);
            });
            let maxCount = -1, resultIdx = 0;
            for (let i = 0; i < CHARACTERS.length; i++) {
                const cnt = countMap.get(i) || 0;
                if (cnt > maxCount) { maxCount = cnt; resultIdx = i; }
            }
            return resultIdx;
        }

        function showResult() {
            const character = CHARACTERS[getResultCharacterIdx()];
            resultName.textContent = character.name;
            resultDesc.textContent = character.desc;
            quizSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            progressFill.style.width = '100%';
        }

        function goToQuestion(index) {
            if (index < 0 || index >= QUESTIONS.length) return;
            currentQ = index; renderQuestion();
        }

        function handleNext() {
            if (answers[currentQ] === null) { alert('请先选择一个选项。'); return; }
            if (currentQ === QUESTIONS.length - 1) {
                if (!allAnswered()) { alert('请完成所有题目后再查看结果。'); return; }
                showResult();
            } else { goToQuestion(currentQ + 1); }
        }

        function handlePrev() { if (currentQ > 0) goToQuestion(currentQ - 1); }

        function startQuiz() {
            coverSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            currentQ = 0;
            answers = new Array(QUESTIONS.length).fill(null);
            progressFill.style.width = '0%';
            renderQuestion();
        }

        function restartGame() {
            coverSection.classList.remove('hidden');
            quizSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            currentQ = 0;
            answers = new Array(QUESTIONS.length).fill(null);
            progressFill.style.width = '0%';
        }

        function init() {
            startBtn.addEventListener('click', startQuiz);
            prevBtn.addEventListener('click', handlePrev);
            nextBtn.addEventListener('click', handleNext);
            restartBtn.addEventListener('click', restartGame);
        }
        init();
    </script>
</body>
</html>
